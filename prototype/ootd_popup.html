<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OOTD 生成结果</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: rgba(0, 0, 0, 0.5);
            color: #333;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .status-bar {
            height: 44px;
            background-color: transparent;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            font-size: 12px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            color: white;
        }

        .popup-container {
            background-color: white;
            border-radius: 24px 24px 0 0;
            padding: 20px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .handle {
            width: 40px;
            height: 5px;
            background-color: #e0e0e0;
            border-radius: 3px;
            margin: 0 auto 20px;
        }

        .carousel {
            position: relative;
            margin: 20px 0;
            border-radius: 16px;
            overflow: hidden;
            height: 400px;
        }

        .carousel-inner {
            display: flex;
            transition: transform 0.5s ease;
            height: 100%;
        }

        .carousel-item {
            min-width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
        }

        .carousel-control {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
        }

        .carousel-prev {
            left: 10px;
        }

        .carousel-next {
            right: 10px;
        }

        .carousel-indicators {
            position: absolute;
            bottom: 15px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.5);
        }

        .indicator.active {
            background-color: white;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 30px;
            height: 30px;
            background-color: rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .outfit-suggestion {
            background-color: #f9f9f9;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .outfit-title {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .outfit-title i {
            margin-right: 8px;
            color: #07c160;
        }

        .share-btn {
            background-color: #07c160;
            color: white;
            border-radius: 24px;
            padding: 12px 24px;
            font-weight: bold;
            width: 100%;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
    </style>
</head>
<body>
    <!-- 状态栏 -->
    <div class="status-bar">
        <div>20:15</div>
        <div class="flex space-x-2">
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi"></i>
            <i class="fas fa-battery-full"></i>
        </div>
    </div>

    <!-- 弹出层 -->
    <div class="popup-container">
        <div class="handle"></div>
        <a href="home.html" class="close-btn">
            <i class="fas fa-times"></i>
        </a>

        <h2 class="text-xl font-bold mb-2">今日OOTD推荐</h2>
        <p class="text-sm text-gray-500 mb-4">基于当前天气和你选择的「甜酷风」风格</p>

        <!-- 穿搭建议 -->
        <div class="outfit-suggestion">
            <div class="outfit-title">
                <i class="fas fa-lightbulb text-xl"></i>
                <h3 class="font-semibold">穿搭建议</h3>
            </div>
            <p class="text-sm">
                今天北京天气晴朗，温度在12-22°C之间，建议穿着轻薄外套搭配长裤。甜酷风可以选择oversized卫衣配高腰牛仔裤，脚踩厚底运动鞋，搭配棒球帽和链条包，既保暖又时尚。
            </p>
        </div>

        <!-- 图片轮播 -->
        <div class="carousel">
            <div class="carousel-inner">
                <div class="carousel-item" style="background-image: url('https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=720&q=80')"></div>
                <div class="carousel-item" style="background-image: url('https://images.unsplash.com/photo-1529139574466-a303027c1d8b?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=720&q=80')"></div>
                <div class="carousel-item" style="background-image: url('https://images.unsplash.com/photo-1581044777550-4cfa60707c03?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=720&q=80')"></div>
            </div>

            <div class="carousel-control carousel-prev">
                <i class="fas fa-chevron-left"></i>
            </div>
            <div class="carousel-control carousel-next">
                <i class="fas fa-chevron-right"></i>
            </div>

            <div class="carousel-indicators">
                <div class="indicator active"></div>
                <div class="indicator"></div>
                <div class="indicator"></div>
            </div>
        </div>

        <!-- 分享按钮 -->
        <button class="share-btn">
            <i class="fas fa-share-alt"></i>
            分享我的OOTD
        </button>
    </div>

    <script>
        // 轮播图功能
        let currentSlide = 0;
        const slides = document.querySelectorAll('.carousel-item');
        const indicators = document.querySelectorAll('.indicator');
        const totalSlides = slides.length;

        function updateCarousel() {
            const carouselInner = document.querySelector('.carousel-inner');
            carouselInner.style.transform = `translateX(-${currentSlide * 100}%)`;

            // 更新指示器
            indicators.forEach((indicator, index) => {
                if (index === currentSlide) {
                    indicator.classList.add('active');
                } else {
                    indicator.classList.remove('active');
                }
            });
        }

        document.querySelector('.carousel-next').addEventListener('click', () => {
            currentSlide = (currentSlide + 1) % totalSlides;
            updateCarousel();
        });

        document.querySelector('.carousel-prev').addEventListener('click', () => {
            currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
            updateCarousel();
        });

        // 点击指示器切换
        indicators.forEach((indicator, index) => {
            indicator.addEventListener('click', () => {
                currentSlide = index;
                updateCarousel();
            });
        });
    </script>
</body>
</html>
