<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天气+OOTD小程序原型</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f5f5;
        }
        .phone-frame {
            width: 300px;
            height: 650px;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border: 12px solid #000;
            position: relative;
        }
        .iframe-container {
            width: 100%;
            height: 100%;
            border: none;
        }
        .frames-container {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            gap: 20px;
            padding: 20px 0;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-8">
    <h1 class="text-3xl font-bold mb-8">天气+OOTD小程序原型</h1>

    <div class="frames-container">
        <div class="flex flex-col items-center">
            <h2 class="text-xl font-semibold mb-3">首页 - OOTD</h2>
            <div class="phone-frame">
                <iframe src="home.html" class="iframe-container"></iframe>
            </div>
        </div>

        <div class="flex flex-col items-center">
            <h2 class="text-xl font-semibold mb-3">OOTD生成弹窗</h2>
            <div class="phone-frame">
                <iframe src="ootd_popup.html" class="iframe-container"></iframe>
            </div>
        </div>

        <div class="flex flex-col items-center">
            <h2 class="text-xl font-semibold mb-3">我的页面</h2>
            <div class="phone-frame">
                <iframe src="profile.html" class="iframe-container"></iframe>
            </div>
        </div>

        <div class="flex flex-col items-center">
            <h2 class="text-xl font-semibold mb-3">首次使用引导</h2>
            <div class="phone-frame">
                <iframe src="onboarding.html" class="iframe-container"></iframe>
            </div>
        </div>
    </div>
</body>
</html>
